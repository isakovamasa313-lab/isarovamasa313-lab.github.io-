<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивна вебсторінка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f6f9;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #555555;
            font-size: 18px;
            margin-bottom: 25px;
        }
        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Вітаю на моїй вебсторінці!</h1>
    <p>Натисніть на будь-яку з кнопок нижче, щоб побачити спливаюче повідомлення.</p>

    <button id="btn1">Привітання</button>
    <button id="btn2">Факт дня</button>
    <button id="btn3">Побажання</button>

    <script src="script.js"></script>
</body>
</html>
